  </div>
  <!-- NAVIGATION -->
  <nav>
   <a class="nav-logo" href="#" data-text="site.navLogo"></a>
   <ul class="nav-links">
    <li><a href="#about">About</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#services">Services</a></li>
    <li><a href="#portfolio">Portfolio</a></li>
    <li><a href="#contact">Contact</a></li>
   </ul>
   <div class="menu-toggle" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  </nav>
  <!-- HERO -->
  <section class="hero" id="about">
   <div class="hero-content">
    <div class="hero-text">
     <div class="hero-tag" data-text="hero.tag"></div>
     <h1 class="hero-name" id="heroName"></h1>
     <p class="hero-title" data-text="hero.title"></p>
     <p class="hero-desc" data-text="hero.description"></p>
     <div class="hero-stats" id="heroStats"></div>
     <div class="hero-cta">
      <a class="cv-btn" id="cvBtn" href="#" download>
       <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
       Download CV
      </a>
     </div>
    </div>
    <div class="hero-image">
     <div class="profile-frame">
      <img alt="" decoding="async" id="profileImg"/>
     </div>
    </div>
   </div>
  </section>
  <div class="divider"></div>
  <!-- SKILLS -->
  <section class="fade-in" id="skills">
   <div class="section-header">
    <div class="section-label">Expertise</div>
    <h2 class="section-title">TOOLS &amp; SKILLS</h2>
   </div>
   <div class="skills-grid" id="skillsGrid"></div>
  </section>
  <div class="divider"></div>
  <!-- SERVICES -->
  <section class="fade-in" id="services">
   <div class="section-header">
    <div class="section-label">What I Do</div>
    <h2 class="section-title">SERVICES</h2>
   </div>
   <div class="services-list" id="servicesList"></div>
  </section>
  <div class="divider"></div>
  <!-- PORTFOLIO -->
  <section class="fade-in" id="portfolio">
   <div class="section-header">
    <div class="section-label">Selected Work</div>
    <h2 class="section-title">PORTFOLIO</h2>
   </div>
   <div class="portfolio-tabs" id="portfolioTabs"></div>
   <div class="portfolio-grid" id="portfolioGrid"></div>
  </section>
  <div class="divider"></div>
  <!-- CONTACT -->
  <section class="fade-in" id="contact">
   <div class="section-header">
    <div class="section-label">Get in Touch</div>
    <h2 class="section-title">LET'S WORK TOGETHER</h2>
   </div>
   <div class="contact-grid" id="contactGrid"></div>
  </section>
  <!-- UNIFIED PROJECT VIEWER -->
  <div class="viewer" id="viewer" onclick="viewerBackdrop(event)">
   <div class="viewer-bar">
    <div class="viewer-meta">
     <h3 id="viewerTitle"></h3>
     <span id="viewerSub"></span>
    </div>
    <div class="viewer-tools">
     <span class="viewer-counter" id="viewerCounter"></span>
     <button class="viewer-close" aria-label="Close" onclick="closeViewer()">&times;</button>
    </div>
   </div>
   <!-- gallery / single mode -->
   <div class="viewer-stage" id="viewerStage" onclick="event.stopPropagation()">
    <button class="viewer-nav viewer-prev" aria-label="Previous" onclick="viewerNav(-1)">&#8249;</button>
    <div class="viewer-imgwrap"><img id="viewerImg" alt=""/></div>
    <button class="viewer-nav viewer-next" aria-label="Next" onclick="viewerNav(1)">&#8250;</button>
   </div>
   <!-- flipbook mode -->
   <div class="flipbook-stage" id="flipStage" onclick="event.stopPropagation()">
    <button class="viewer-nav viewer-prev" aria-label="Previous spread" onclick="flipNav(-1)">&#8249;</button>
    <div class="flipbook" id="flipbook">
     <div class="flip-page flip-left"><img id="flipLeft" alt=""/></div>
     <div class="flip-page flip-right"><img id="flipRight" alt=""/></div>
    </div>
    <button class="viewer-nav viewer-next" aria-label="Next spread" onclick="flipNav(1)">&#8250;</button>
   </div>
   <!-- scroll mode (identity decks) -->
   <div class="scroll-stage" id="scrollStage" onclick="event.stopPropagation()"></div>
   <!-- grid mode (social) -->
   <div class="grid-stage" id="gridStage" onclick="event.stopPropagation()"></div>
  </div>
  <!-- IMAGE LIGHTBOX (popped image from grid) -->
  <div class="imglightbox" id="imgLightbox" onclick="closeImgLightbox(event)">
   <button class="viewer-close imglightbox-close" aria-label="Close" onclick="closeImgLightbox(event)">&times;</button>
   <img id="imgLightboxImg" alt=""/>
  </div>

  <!-- FOOTER -->
  <footer id="footer"></footer>
  <script src="script.js"></script>
 </body>
</html>
